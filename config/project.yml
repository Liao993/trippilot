project:
  name: trippilot
  owner: Henry

databricks:
  catalog: trippilot_dev
  schemas:
    bronze: bronze
    silver: silver
    gold: gold
  volumes:
    source_files: /Volumes/trippilot_dev/bronze/source_files

sources:
  # Dataset-level source registry. Each dataset's exact landed object is
  # resolved from the source manifest (ops.source_file_manifest) by
  # identity, never from a path here: snapshot dates and file identities
  # are per-file registration state, not project configuration. The
  # required_identifier values mirror the Bronze contracts' key fields.
  airbnb:
    provider: insideairbnb
    file_format: csv_gzip
    cities:
      toronto:
        enabled: true
        datasets:
          listings:
            file: listings.csv.gz
            required_identifier: id
          calendar:
            file: calendar.csv.gz
            required_identifier: listing_id
          reviews:
            file: reviews.csv.gz
            required_identifier: id
          # F07.1/F07.2: the summary and neighbourhood reference files
          # are registered per-file in the source manifest (distinct
          # file_type + content hash); these entries record their
          # dataset identity and key fields only.
          summary_listings:
            file: listings.csv
            required_identifier: id
          summary_reviews:
            file: reviews.csv
            required_identifier: listing_id
          neighbourhoods:
            file: neighbourhoods.csv
            required_identifier: neighbourhood
          neighbourhood_geometry:
            file: neighbourhoods.geojson
            required_identifier: neighbourhood
