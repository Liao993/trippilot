# Source-asset availability ledger contract (F07.3-T01).
#
# The source manifest records one immutable row per ACQUIRED file and
# cannot represent an expected asset that the source did not publish
# for a snapshot. This ledger records exactly that: one row per
# expected asset identity, evidence-backed. Truth about acquired bytes
# stays solely in the manifest; this ledger never duplicates it.
#
# Stages:
# - not_published: the source's own evidence confirms the asset was
#   not published for this snapshot. Requires evidence_url +
#   evidence_note, and is refused when a landed manifest record exists
#   for the same identity and file type. A download failure or timeout
#   must never be recorded as not_published.
# - available: supersedes a prior not_published claim once bytes have
#   landed. Requires the landed source_file_id, verified against the
#   manifest store and matched to the identity.

name: source_file_availability
purpose: >-
  Evidence-backed availability status per expected source asset,
  distinguishing confirmed not-published assets from acquisition
  failures and parse/schema failures recorded in the manifest.
table: trippilot_dev.ops.source_file_availability

states:
  - not_published
  - available

fields:
  availability_id:
    type: string
    required: true
    description: >-
      Deterministic ID: SHA-256 over
      "source_family|source_entity_id|source_version|file_type|availability"
      (identity only, never a content hash, so it can never collide
      with manifest source_file_id values). One row per expected asset.
  source_family:
    type: string
    required: true
    description: Source family, for example insideairbnb.
  source_entity_id:
    type: string
    required: true
    description: City or entity identifier the snapshot belongs to.
  source_version:
    type: string
    required: true
    description: Snapshot date or release identifier this asset belongs to.
  file_type:
    type: string
    required: true
    description: Canonical file-type label from the manifest contract.
  availability_state:
    type: string
    required: true
    description: One of the controlled states above.
  evidence_url:
    type: string
    required: false
    description: >-
      The source listing or page checked as evidence; required when
      the state is not_published and must start with https:// or http://.
  evidence_note:
    type: string
    required: false
    description: >-
      What the operator observed at the evidence URL; required when
      the state is not_published. Credentials are redacted.
  landed_source_file_id:
    type: string
    required: false
    description: >-
      The manifest source_file_id of the landed bytes; required when
      the state is available and never allowed when not_published.
  checked_at_utc:
    type: string
    required: true
    description: ISO-8601 UTC timestamp of the availability check.
  recorded_by:
    type: string
    required: true
    description: Operator or agent that performed the check (audit).
  run_id:
    type: string
    required: true
    description: Provenance run ID from src/common/provenance.build_run_id.

rules:
  - One row per expected asset identity; upserts merge on
    availability_id and update only the availability/evidence fields.
  - Recording not_published is refused when a landed manifest record
    exists for the same identity and file type.
  - A download failure or timeout is never recorded as not_published;
    only confirmed evidence of absence qualifies.
  - The ledger is current-state per asset; acquisition history stays in
    the manifest and ingestion history in the per-dataset control
    tables.
