name: TripPilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/add-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI tools
        run: python -m pip install -r requirements.txt

      - name: Lint helpers and tests
        run: ruff check src tests

      - name: Check Python formatting
        run: ruff format --check src tests

      - name: Validate YAML configuration and contracts
        run: python -m src.quality.config_validation

      - name: Validate notebooks and source files
        run: python -m src.quality.notebook_validation

      - name: Scan Python dependencies (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit --requirement requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -v

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
