name: TripPilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/add-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI tools
        run: python -m pip install ruff pytest pyyaml

      - name: Lint helpers and tests
        run: ruff check src tests

      - name: Check Python formatting
        run: ruff format --check src tests

      - name: Validate YAML configuration and contracts
        run: python -m src.quality.config_validation

      - name: Run unit tests
        run: python -m pytest tests -v
